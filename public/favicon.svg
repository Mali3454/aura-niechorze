<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- tło -->
  <rect width="32" height="32" rx="7" fill="#0f2237"/>

  <!-- promienie światła -->
  <line x1="16" y1="6" x2="16" y2="2.5" stroke="#c9a050" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="16" y1="6" x2="19.5" y2="3.5" stroke="#c9a050" stroke-width="1.4" stroke-linecap="round" opacity="0.7"/>
  <line x1="16" y1="6" x2="12.5" y2="3.5" stroke="#c9a050" stroke-width="1.4" stroke-linecap="round" opacity="0.7"/>

  <!-- daszek latarni -->
  <polygon points="12,9 16,6 20,9" fill="#c9a050"/>

  <!-- latarenka (szklana część) -->
  <rect x="12.5" y="9" width="7" height="3.5" rx="0.5" fill="#c9a050"/>
  <!-- blask w latarni -->
  <rect x="13.5" y="9.8" width="5" height="1.8" rx="0.3" fill="#fff" opacity="0.3"/>

  <!-- korpus latarni — lekko zwężany ku górze -->
  <path d="M13.5,12.5 L12.5,22 L19.5,22 L18.5,12.5 Z" fill="#c9a050"/>
  <!-- pasek dekoracyjny na korpusie -->
  <rect x="12.5" y="16" width="7" height="1.2" fill="#0f2237" opacity="0.35"/>

  <!-- podstawa -->
  <rect x="11.5" y="22" width="9" height="2" rx="1" fill="#c9a050"/>

  <!-- fale -->
  <path d="M4,26.5 C7,25 10,27 13,26 C16,25 19,27 22,26 C24.5,25.3 27,26 28,26"
        stroke="#2589a8" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M4,29 C7,27.5 10,29.5 13,28.5 C16,27.5 19,29.5 22,28.5 C24.5,27.8 27,28.5 28,28.5"
        stroke="#2589a8" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.5"/>
</svg>
